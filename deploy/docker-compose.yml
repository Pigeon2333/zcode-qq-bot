version: "3.8"
# ZCode QQ Bot · 全家桶：NapCat + 机器人核心 一键部署
# 用法：docker compose up -d   然后  docker compose logs -f bot
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: zcode-napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=${BOT_QQ:-3126940548}
      - NAPCAT_GID=0
      - NAPCAT_UID=0
    ports:
      - "3001:3001"    # OneBot WS（daemon 连这里）
      - "6099:6099"    # WebUI（扫码登录用，登录后可关）
    volumes:
      - napcat_data:/app/qq/config

  bot:
    image: python:3.11-slim
    container_name: zcode-qq-bot
    restart: unless-stopped
    depends_on:
      - napcat
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir edge-tts pycryptodome &&
                python linux_headless.py"
    environment:
      - QQBOT_DATA_DIR=/data
      - PYTHONUNBUFFERED=1
    ports:
      - "39765:39765"  # 控制台
    volumes:
      - ./:/app:ro
      - bot_data:/data

volumes:
  napcat_data:
  bot_data:
